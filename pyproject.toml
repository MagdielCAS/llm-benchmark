[project]
name = "llm-benchmark"
version = "0.1.0"
description = "Local LLM benchmark suite using Ollama"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27.0",
    "questionary>=2.0.1",
    "rich>=13.7.0",
    "python-frontmatter>=1.1.0",
    "PyYAML>=6.0.2",
    "python-dotenv>=1.2.1",
    "markdown-pdf>=1.13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
